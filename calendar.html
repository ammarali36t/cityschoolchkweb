<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School Calendar | TCS Chakwal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" type="image/png" href="./assets/favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .calendar-container {
            position: relative;
            padding-bottom: 120%; /* Increased height on mobile for comfortable scrolling */
            height: 0;
            overflow: hidden;
        }
        @media (min-width: 768px) {
            .calendar-container { padding-bottom: 60%; }
        }
        .calendar-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }
    </style>
</head>
<body class="bg-slate-50">

    <div class="bg-[#ffed00] h-2 w-full"></div>

    <nav class="bg-white border-b-4 border-[#ffed00] sticky top-0 z-50 px-4 py-3">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex items-center">
                <a href="index.html" class="block group">
                    <img src="./assets/logo-official.png" alt="The City School" class="h-12 md:h-16 w-auto object-contain transition-transform group-hover:scale-[1.02]">
                </a>
            </div>
            
            <a href="index.html" class="bg-[#1a4789] text-white px-5 py-2 rounded-full text-xs font-black uppercase tracking-widest hover:bg-[#ffed00] hover:text-[#1a4789] transition shadow-md">
                <i class="fas fa-home mr-2"></i> Home
            </a>
        </div>
    </nav>

    <header class="py-16 bg-[#1a4789] text-center px-4">
        <h1 class="text-[#ffed00] font-black text-4xl md:text-6xl uppercase tracking-tighter italic mb-4">School Calendar</h1>
        <p class="text-blue-100 uppercase tracking-[0.3em] text-[10px] md:text-xs font-bold">Stay Updated with Events & Holidays</p>
    </header>

    <main class="max-w-6xl mx-auto px-4 py-12">
        <div class="bg-white p-4 md:p-8 rounded-[2.5rem] shadow-2xl border-2 border-slate-100">
            
            <div class="flex flex-wrap gap-4 mb-8">
                <div class="bg-blue-50 px-4 py-2 rounded-xl flex items-center">
                    <div class="w-3 h-3 rounded-full bg-blue-600 mr-2"></div>
                    <span class="text-[#1a4789] text-[10px] font-black uppercase tracking-wider">Academic Events</span>
                </div>
                <div class="bg-yellow-50 px-4 py-2 rounded-xl flex items-center">
                    <div class="w-3 h-3 rounded-full bg-yellow-500 mr-2"></div>
                    <span class="text-[#1a4789] text-[10px] font-black uppercase tracking-wider">Public Holidays</span>
                </div>
            </div>

            <div class="hidden md:block calendar-container rounded-2xl overflow-hidden border border-slate-200">
                <iframe src="https://calendar.google.com/calendar/embed?src=7242f26061eba75d318614a1258000cc0da5c7996edaf567c260f36c1e61f2d5%40group.calendar.google.com&ctz=Asia%2FKarachi" style="border: 0" width="800" height="600" frameborder="0" scrolling="no"></iframe> 
            </div>

            <div class="block md:hidden calendar-container rounded-2xl overflow-hidden border border-slate-200">
                <iframe src="https://calendar.google.com/calendar/embed?src=7242f26061eba75d318614a1258000cc0da5c7996edaf567c260f36c1e61f2d5%40group.calendar.google.com&ctz=Asia%2FKarachi&mode=AGENDA&showNav=1&showPrint=0&showTabs=0&showCalendars=0" style="border: 0" width="100%" height="500" frameborder="0" scrolling="yes"></iframe> 
            </div>

        </div>

        <div class="mt-8 text-center px-4">
            <p class="text-slate-400 text-xs font-medium italic">
                * Calendar is updated in real-time by the campus administration.
            </p>
        </div>
    </main>

    <footer class="bg-[#1a4789] py-10 text-center">
        <p class="text-[#ffed00] font-black tracking-widest italic uppercase">I Am - To Learn</p>
    </footer>

</body>
</html>
