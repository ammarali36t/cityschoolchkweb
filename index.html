<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The City School | Chakwal Campus</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        /* Official TCS Colors based on your logo */
        .bg-tcs-blue { background-color: #1a4789; }
        .text-tcs-blue { color: #1a4789; }
        .bg-tcs-yellow { background-color: #ffed00; }
        .border-tcs-yellow { border-color: #ffed00; }
    </style>
</head>
<body class="bg-gray-50 font-sans">

    <div class="bg-tcs-yellow h-2 w-full"></div>

    <nav class="bg-white shadow-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-24 items-center">
                
                <div class="flex items-center">
                    <img src="./assets/logo.png" alt="TCS Logo" class="h-20 w-auto mr-4">
                    <div class="flex flex-col">
                        <span class="text-tcs-blue font-black text-2xl tracking-tighter leading-none uppercase">
                            The City School
                        </span>
                        <span class="text-gray-500 text-xs font-bold tracking-[0.3em] uppercase mt-1">
                            Chakwal Campus
                        </span>
                    </div>
                </div>

                <div class="hidden md:flex space-x-10">
                    <a href="#" class="text-tcs-blue font-bold hover:text-yellow-500 transition uppercase text-sm">Home</a>
                    <a href="#gallery" class="text-tcs-blue font-bold hover:text-yellow-500 transition uppercase text-sm">Gallery</a>
                    <a href="#about" class="text-tcs-blue font-bold hover:text-yellow-500 transition uppercase text-sm">About</a>
                    <a href="#contact" class="text-tcs-blue font-bold hover:text-yellow-500 transition uppercase text-sm">Contact</a>
                </div>

                <div class="md:hidden text-tcs-blue text-2xl">
                    <i class="fas fa-bars"></i>
                </div>
            </div>
        </div>
    </nav>
    <header class="relative h-[80vh] flex items-center justify-center overflow-hidden">
        <div class="absolute inset-0 z-0">
            <img src="https://images.unsplash.com/photo-1546410531-bb4caa6b424d?q=80&w=2071" class="w-full h-full object-cover">
            <div class="absolute inset-0 bg-tcs-blue opacity-60"></div>
        </div>

        <div class="relative z-10 text-center px-4 max-w-4xl">
            <h2 class="text-tcs-yellow font-black text-6xl md:text-8xl mb-4 tracking-tighter drop-shadow-2xl">
                I AM - <span class="text-white">TO LEARN</span>
            </h2>
            <p class="text-white text-xl md:text-2xl font-light mb-10 tracking-widest uppercase">
                The City School Chakwal Campus
            </p>
            <div class="flex flex-col md:flex-row justify-center gap-4">
                <a href="#gallery" class="bg-tcs-yellow text-tcs-blue px-10 py-4 rounded-sm font-black uppercase tracking-widest hover:bg-white transition-all transform hover:-translate-y-1">
                    View Gallery
                </a>
                <a href="#contact" class="border-2 border-white text-white px-10 py-4 rounded-sm font-black uppercase tracking-widest hover:bg-white hover:text-tcs-blue transition-all">
                    Contact Us
                </a>
            </div>
        </div>

        <div class="absolute bottom-0 w-full">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 320">
                <path fill="#f9fafb" fill-opacity="1" d="M0,96L48,112C96,128,192,160,288,186.7C384,213,480,235,576,213.3C672,192,768,128,864,128C960,128,1056,192,1152,208C1248,224,1344,192,1392,176L1440,160L1440,320L1392,320C1344,320,1248,320,1152,320C1056,320,960,320,864,320C768,320,672,320,576,320C480,320,384,320,288,320C192,320,96,320,48,320L0,320Z"></path>
            </svg>
        </div>
    </header>

    
</body>
</html>
