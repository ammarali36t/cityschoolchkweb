    <header class="py-16 md:py-24 bg-[#1a4789] text-center px-4">

    </header>

    <main class="max-w-7xl mx-auto px-4 py-12">
        <div id="achievers-container" class="space-y-16">
            <p class="text-center text-slate-400 animate-pulse">Syncing Hall of Fame...</p>
        </div>
    </main>

    <footer class="bg-[#1a4789] py-12 text-center border-t-4 border-[#ffed00]">
        <p class="text-[#ffed00] font-black tracking-[0.4em] uppercase italic">I AM - TO LEARN</p>
    </footer>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        const btn = document.getElementById('mobile-menu-button');
        const menu = document.getElementById('mobile-menu');
        if (btn && menu) { btn.addEventListener('click', () => menu.classList.toggle('hidden')); }
    });

    async function loadAchievers() {
        const container = document.getElementById('achievers-container');
        const repoOwner = "ammarali36t";
        const repoName = "cityschoolchkweb";
        const folderPath = "content/achievers";

        // Define the strict order of classes
        const classOrder = ["Senior III", "Senior II", "Senior I", "Grade 9", "Grade 8", "Grade 7", "Grade 6", "Grade 5", "Grade 4", "Grade 3", "Grade 2", "Grade 1"];

        try {
            const response = await fetch(`https://api.github.com/repos/${repoOwner}/${repoName}/contents/${folderPath}?t=${new Date().getTime()}`);
            const files = await response.json();
            if (!Array.isArray(files)) return;

            let allStudents = [];
            for (const file of files) {
                if (file.name.endsWith('.json')) {
                    const contentRes = await fetch(file.download_url);
                    const student = await contentRes.json();
                    
                    // RULE 1: Filter Senior III & II (Only show A or A*)
                    if (student.student_grade === "Senior III" || student.student_grade === "Senior II") {
                        const res = student.result.toUpperCase();
                        if (!res.includes('A*') && !res.includes('A')) continue; 
                    }
                    allStudents.push(student);
                }
            }

            // RULE 2: Sort by our defined classOrder
            const grouped = allStudents.reduce((acc, student) => {
                const g = student.student_grade;
                if (!acc[g]) acc[g] = [];
                acc[g].push(student);
                return acc;
            }, {});

            container.innerHTML = ''; 

            classOrder.forEach(gradeName => {
                if (grouped[gradeName]) {
                    let studentsToShow = grouped[gradeName];

                    // RULE 3: For Senior I, only show the top 3 students
                    if (gradeName === "Senior I") {
                        studentsToShow = studentsToShow.sort((a,b) => (a.order || 0) - (b.order || 0)).slice(0, 3);
                    } else {
                        studentsToShow = studentsToShow.sort((a,b) => (a.order || 0) - (b.order || 0));
                    }

                    const section = document.createElement('section');
                    section.innerHTML = `
                        <div class="flex items-center mb-10">
                            <div class="h-10 w-2 bg-[#ffed00] mr-4 shadow-sm"></div>
                            <h2 class="text-[#1a4789] text-2xl md:text-3xl font-black uppercase tracking-tight">${gradeName}</h2>
                        </div>
                        <div class="grid grid-cols-3 md:grid-cols-4 gap-3 md:gap-8">
                            ${studentsToShow.map(student => {
                                let cleanPath = student.image.replace(/^(\.\/|\/)/, ''); 
                                const imgUrl = `https://raw.githubusercontent.com/${repoOwner}/${repoName}/main/${cleanPath}`;
                                return `
                                    <div class="achiever-card bg-white rounded-xl shadow-sm border border-slate-100 p-2 md:p-6 text-center border-t-4 border-[#1a4789]">
                                        <div class="relative mx-auto w-16 h-16 md:w-28 md:h-28 mb-3">
                                            <img src="${imgUrl}" class="rounded-full w-full h-full object-cover border-2 md:border-4 border-[#ffed00]" 
                                                 onerror="this.src='https://ui-avatars.com/api/?name=${encodeURIComponent(student.title)}&background=1a4789&color=fff'">
                                        </div>
                                        <h3 class="text-[#1a4789] font-black text-[9px] md:text-lg uppercase leading-tight px-1">${student.title}</h3>
                                        <div class="mt-2 bg-blue-50 rounded-lg py-1">
                                            <span class="text-[#1a4789] font-black text-[10px] md:text-xl">${student.result}</span>
                                        </div>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    `;
                    container.appendChild(section);
                }
            });
        } catch (error) { console.error("Error:", error); }
    }
    window.onload = loadAchievers;
</script>
