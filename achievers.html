            <a href="gallery.html" class="text-[#1a4789] font-bold uppercase text-xs border-b pb-2">Gallery</a>

    <header class="py-16 md:py-24 bg-[#1a4789] text-center px-4">
        <h1 class="text-[#ffed00] font-black text-4xl md:text-6xl uppercase italic mb-2 tracking-tighter">High Achievers</h1>
        <p class="text-white opacity-80 uppercase tracking-[0.3em] text-[10px] font-bold">Celebrating Academic Excellence</p>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-12">
        <div id="achievers-container" class="space-y-16">
            <p class="text-center text-slate-400 animate-pulse">Syncing Hall of Fame...</p>
        </div>
    </main>

    <footer class="bg-[#1a4789] py-12 text-center border-t-4 border-[#ffed00]">
        <p class="text-[#ffed00] font-black tracking-[0.4em] uppercase italic">I AM - TO LEARN</p>
    </footer>

    <script>
        // 1. MOBILE MENU TOGGLE
        document.addEventListener('DOMContentLoaded', () => {
            const btn = document.getElementById('mobile-menu-button');
            const menu = document.getElementById('mobile-menu');
            if (btn && menu) {
                btn.addEventListener('click', () => menu.classList.toggle('hidden'));
            }
        });

        // 2. DYNAMIC ACHIEVERS LOADER
        async function loadAchievers() {
            const container = document.getElementById('achievers-container');
            const repoOwner = "ammarali36t";
            const repoName = "cityschoolchkweb";
            const folderPath = "content/achievers";

            try {
                const response = await fetch(`https://api.github.com/repos/${repoOwner}/${repoName}/contents/${folderPath}?t=${new Date().getTime()}`);
                const files = await response.json();
                
                if (!Array.isArray(files)) {
                    container.innerHTML = '<p class="text-center text-slate-400">No achievers found yet.</p>';
                    return;
                }

                let allStudents = [];

                // Fetch student JSON files
                for (const file of files) {
                    if (file.name.endsWith('.json')) {
                        const contentRes = await fetch(file.download_url);
                        const data = await contentRes.json();
                        allStudents.push(data);
                    }
                }

                // Sort by the 'order' field set in Admin
                allStudents.sort((a, b) => (a.order || 0) - (b.order || 0));

                // Group students by "student_grade"
                const grouped = allStudents.reduce((acc, student) => {
                    const grade = student.student_grade || "Distinction Holders";
                    if (!acc[grade]) acc[grade] = [];
                    acc[grade].push(student);
                    return acc;
                }, {});

                container.innerHTML = ''; 

                // Generate HTML sections for each grade
                for (const grade in grouped) {
                    const section = document.createElement('section');
                    section.className = "fade-in";
                    section.innerHTML = `
                        <div class="flex items-center mb-10">
                            <div class="h-10 w-2 bg-[#ffed00] mr-4 shadow-sm"></div>
                            <h2 class="text-[#1a4789] text-2xl md:text-3xl font-black uppercase tracking-tight">${grade}</h2>
                        </div>
                        <div class="grid grid-cols-3 md:grid-cols-4 gap-3 md:gap-8">
                            ${grouped[grade].map(student => {
                                let cleanPath = student.image.replace(/^(\.\/|\/)/, ''); 
                                const imgUrl = `https://raw.githubusercontent.com/${repoOwner}/${repoName}/main/${cleanPath}`;
                                
                                return `
                                    <div class="achiever-card bg-white rounded-xl shadow-sm border border-slate-100 p-2 md:p-6 text-center hover:shadow-md border-t-4 border-[#1a4789]">
                                        <div class="relative mx-auto w-16 h-16 md:w-28 md:h-28 mb-3">
                                            <img src="${imgUrl}" alt="${student.title}" 
                                                 class="rounded-full w-full h-full object-cover border-2 md:border-4 border-[#ffed00]" 
                                                 style="aspect-ratio: 1/1;"
                                                 onerror="this.src='https://ui-avatars.com/api/?name=${encodeURIComponent(student.title)}&background=1a4789&color=fff'">
                                        </div>
                                        <h3 class="text-[#1a4789] font-black text-[9px] md:text-lg uppercase leading-tight px-1">${student.title}</h3>
                                        <div class="mt-2 bg-blue-50 rounded-lg py-1">
                                            <span class="text-[#1a4789] font-black text-[10px] md:text-xl">${student.result}</span>
                                            ${student.percentage ? `<p class="text-[7px] md:text-[10px] font-bold text-slate-500">${student.percentage}%</p>` : ''}
                                        </div>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    `;
                    container.appendChild(section);
                }

            } catch (error) {
                console.error("Error:", error);
                container.innerHTML = '<p class="text-center text-slate-400">Error loading achievers. Please refresh.</p>';
            }
        }
        window.onload = loadAchievers;
    </script>
</body>
