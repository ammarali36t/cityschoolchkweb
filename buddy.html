<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusBuddy | TCS Chakwal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" type="image/png" href="./assets/favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .chat-bubble { border-radius: 20px 20px 20px 5px; }
        .user-bubble { border-radius: 20px 20px 5px 20px; }
        #chat-window::-webkit-scrollbar { width: 6px; }
        #chat-window::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="flex flex-col h-screen max-h-screen">

    <nav class="bg-white border-b-4 border-[#ffed00] p-4 flex justify-between items-center shadow-sm sticky top-0 z-50">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 bg-[#1a4789] rounded-xl flex items-center justify-center shadow-lg">
                <i class="fas fa-robot text-[#ffed00] text-xl"></i>
            </div>
            <div>
                <span class="block font-black text-[#1a4789] uppercase tracking-tighter leading-none">CampusBuddy</span>
                <span class="text-[8px] font-bold text-green-500 uppercase tracking-widest">Online Assistant</span>
            </div>
        </div>
        <a href="index.html" class="bg-slate-100 text-slate-500 px-4 py-2 rounded-full text-[10px] font-black uppercase hover:bg-red-50 hover:text-red-500 transition">
            Exit <i class="fas fa-times ml-1"></i>
        </a>
    </nav>

    <main class="flex-1 overflow-y-auto p-4 md:p-8 space-y-6" id="chat-window">
        <div class="flex items-start space-x-3">
            <div class="w-8 h-8 bg-[#1a4789] rounded-lg flex-shrink-0 flex items-center justify-center mt-1">
                <i class="fas fa-robot text-[#ffed00] text-xs"></i>
            </div>
            <div class="chat-bubble bg-white border-2 border-slate-100 p-5 max-w-[85%] md:max-w-[60%] text-[#1a4789] text-sm shadow-sm leading-relaxed">
                Hello! I am your <strong>CampusBuddy</strong>. 🤖 <br><br>
                I can help you navigate the portal. Try asking me about:
                <div class="mt-4 grid grid-cols-1 gap-2">
                    <button onclick="autoQuery('Past Papers')" class="text-left p-2 bg-slate-50 rounded-lg hover:bg-[#ffed00] transition text-[11px] font-bold uppercase tracking-tight">• Past Papers</button>
                    <button onclick="autoQuery('School Events')" class="text-left p-2 bg-slate-50 rounded-lg hover:bg-[#ffed00] transition text-[11px] font-bold uppercase tracking-tight">• School Calendar</button>
                    <button onclick="autoQuery('Senior III Subjects')" class="text-left p-2 bg-slate-50 rounded-lg hover:bg-[#ffed00] transition text-[11px] font-bold uppercase tracking-tight">• Senior III Subjects</button>
                </div>
            </div>
        </div>
    </main>

    <footer class="p-4 bg-white border-t border-slate-100 shadow-[0_-10px_20px_rgba(0,0,0,0.02)]">
        <div class="max-w-4xl mx-auto flex items-center space-x-3">
            <input type="text" id="user-input" 
                   onkeypress="if(event.key === 'Enter') sendMessage()"
                   placeholder="Type a question (e.g. 'Show me Senior II')" 
                   class="flex-1 p-4 rounded-2xl bg-slate-50 border-2 border-transparent focus:border-[#1a4789] focus:bg-white outline-none transition font-medium text-sm">
            <button onclick="sendMessage()" class="bg-[#1a4789] text-[#ffed00] w-14 h-14 rounded-2xl flex items-center justify-center hover:scale-105 active:scale-95 transition shadow-lg">
                <i class="fas fa-paper-plane text-lg"></i>
            </button>
        </div>
    </footer>

    <script>
        const chatWindow = document.getElementById('chat-window');
        const userInput = document.getElementById('user-input');

        function autoQuery(q) {
            userInput.value = q;
            sendMessage();
        }

        function sendMessage() {
            const text = userInput.value.trim();
            if (text === "") return;

            // User Bubble
            addMessage(text, 'user');
            userInput.value = "";

            // Buddy Response Logic
            setTimeout(() => {
                const response = getBuddyResponse(text.toLowerCase());
                addMessage(response, 'buddy');
            }, 500);
        }

        function addMessage(content, sender) {
            const wrapper = document.createElement('div');
            wrapper.className = sender === 'user' ? 'flex justify-end' : 'flex items-start space-x-3';
            
            if (sender === 'user') {
                wrapper.innerHTML = `
                    <div class="user-bubble bg-[#1a4789] text-white p-4 max-w-[80%] text-sm font-medium shadow-md">
                        ${content}
                    </div>
                `;
            } else {
                wrapper.innerHTML = `
                    <div class="w-8 h-8 bg-[#1a4789] rounded-lg flex-shrink-0 flex items-center justify-center mt-1">
                        <i class="fas fa-robot text-[#ffed00] text-xs"></i>
                    </div>
                    <div class="chat-bubble bg-white border-2 border-slate-100 p-4 max-w-[85%] text-[#1a4789] text-sm shadow-sm leading-relaxed">
                        ${content}
                    </div>
                `;
            }

            chatWindow.appendChild(wrapper);
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        function getBuddyResponse(input) {
            if (input.includes("past paper") || input.includes("resource") || input.includes("book")) {
                return "You can find all past papers and learning resources on the <a href='resources.html' class='text-blue-600 font-bold underline'>Resources Page</a>.";
            }
            if (input.includes("senior 3") || input.includes("senior iii")) {
                return "Senior III focuses on core subjects: English, Comp Sci, Maths, Chemistry, and Physics. Check the <a href='resources.html' class='text-blue-600 font-bold underline'>Resources Page</a> for materials.";
            }
            if (input.includes("senior 1") || input.includes("senior i") || input.includes("senior 2") || input.includes("senior ii")) {
                return "Senior I & II cover Islamiat, Pak Studies, Urdu, English, Maths, and Sciences. Visit <a href='resources.html' class='text-blue-600 font-bold underline'>Resources</a> to see more.";
            }
            if (input.includes("event") || input.includes("holiday") || input.includes("calendar") || input.includes("date")) {
                return "Stay up to date with holidays and events via our <a href='calendar.html' class='text-blue-600 font-bold underline'>School Calendar</a>.";
            }
            if (input.includes("hello") || input.includes("hi") || input.includes("hey")) {
                return "Hello! I'm ready to help. What are you looking for today?";
            }
            
            return "I'm not sure about that yet! Try asking about <strong>'Resources'</strong>, <strong>'Calendar'</strong>, or <strong>'Senior Levels'</strong>.";
        }
    </script>

</body>
</html>
