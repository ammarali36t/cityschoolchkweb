<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusBuddy | TCS Chakwal</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 flex flex-col h-screen max-h-screen">
    <nav class="bg-white border-b-4 border-[#ffed00] p-4 flex justify-between items-center shadow-sm sticky top-0 z-50">
        <div class="flex items-center gap-3">
            <div class="bg-[#1a4789] p-2 rounded-lg">
                <span class="text-white font-bold">CB</span>
            </div>
            <div>
                <h1 class="text-[#1a4789] font-bold text-xl tracking-tight">CAMPUSBUDDY</h1>
                <p class="text-green-600 text-[10px] font-bold uppercase tracking-widest">Online Assistant</p>
            </div>
        </div>
        <a href="/" class="text-slate-500 hover:text-red-600 text-xs font-bold border-2 border-slate-200 px-3 py-1 rounded-full transition-all">EXIT ×</a>
    </nav>

    <main class="flex-1 overflow-y-auto p-4 md:p-8 space-y-6" id="chat-window">
        <div class="flex justify-start">
            <div class="bg-white border border-slate-100 p-4 rounded-2xl rounded-tl-none shadow-sm max-w-[85%]">
                <p class="text-slate-700 leading-relaxed">Hello! I am your <b>CampusBuddy</b>. 🤖</p>
                <p class="text-slate-500 text-sm mt-2">I can help you navigate the portal. Try asking me about admissions or school timings!</p>
            </div>
        </div>
    </main>

    <footer class="p-4 bg-white border-t border-slate-100 shadow-[0_-10px_20px_rgba(0,0,0,0.02)]">
        <div class="max-w-4xl mx-auto flex gap-3">
            <input type="text" id="user-input" placeholder="Type a question..." 
                class="flex-1 bg-slate-50 border-2 border-slate-100 rounded-2xl px-6 py-4 outline-none focus:border-[#1a4789] transition-all">
            <button onclick="sendMessage()" class="bg-[#1a4789] text-white p-4 rounded-2xl shadow-lg hover:bg-blue-800 transition-all">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" />
                </svg>
            </button>
        </div>
    </footer>

    <script>
        async function sendMessage() {
            const input = document.getElementById('user-input');
            const text = input.value.trim();
            if (!text) return;

            appendMessage('user', text);
            input.value = '';

            try {
                const response = await fetch('/.netlify/functions/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: text })
                });
                
                const data = await response.json();
                appendMessage('bot', data.reply);
            } catch (error) {
                appendMessage('bot', "I'm having trouble connecting. Please ensure your Netlify deploy is successful!");
            }
        }

        function appendMessage(sender, text) {
            const window = document.getElementById('chat-window');
            const msgDiv = document.createElement('div');
            msgDiv.className = sender === 'user' ? 'flex justify-end' : 'flex justify-start';
            
            const inner = document.createElement('div');
            inner.className = sender === 'user' 
                ? 'bg-[#1a4789] text-white p-4 rounded-2xl rounded-tr-none shadow-md max-w-[80%]' 
                : 'bg-white border border-slate-100 p-4 rounded-2xl rounded-tl-none shadow-sm max-w-[80%] text-slate-700';
            
            inner.innerText = text;
            msgDiv.appendChild(inner);
            window.appendChild(msgDiv);
            window.scrollTop = window.scrollHeight;
        }

        document.getElementById('user-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });
    </script>
</body>
</html>
