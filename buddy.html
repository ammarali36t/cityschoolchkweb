<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusBuddy | TCS Chakwal</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 flex flex-col h-screen max-h-screen">
    <nav class="bg-[#1a4789] text-white p-4 shadow-md flex justify-between items-center">
        <h1 class="font-bold text-xl">CAMPUSBUDDY</h1>
        <a href="/" class="text-sm bg-white/10 px-3 py-1 rounded hover:bg-white/20">EXIT</a>
    </nav>

    <main class="flex-1 overflow-y-auto p-4 space-y-4" id="chat-container">
        <div class="flex justify-start">
            <div class="bg-white border border-slate-200 p-4 rounded-2xl shadow-sm max-w-[85%] text-slate-800">
                Hello! I'm your AI CampusBuddy. 🤖 Ask me about admissions or school timings!
            </div>
        </div>
    </main>

    <footer class="p-4 bg-white border-t border-slate-200">
        <div class="max-w-4xl mx-auto flex gap-2">
            <input type="text" id="user-input" placeholder="Type here..." 
                class="flex-1 bg-slate-100 rounded-full px-5 py-3 outline-none focus:ring-2 focus:ring-[#1a4789]">
            <button onclick="sendMessage()" class="bg-[#1a4789] text-white p-3 rounded-full hover:bg-blue-800 transition-all">
                Send
            </button>
        </div>
    </footer>

    <script>
        async function sendMessage() {
            const input = document.getElementById('user-input');
            const text = input.value.trim();
            if (!text) return;

            appendMessage('user', text);
            input.value = '';

            try {
                const response = await fetch('/.netlify/functions/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: text })
                });

                if (!response.ok) throw new Error('AI offline');

                const data = await response.json();
                appendMessage('bot', data.reply);
            } catch (error) {
                appendMessage('bot', "My brain is still connecting to the server. Try again in 30 seconds!");
            }
        }

        function appendMessage(sender, text) {
            const container = document.getElementById('chat-container');
            const msgDiv = document.createElement('div');
            msgDiv.className = sender === 'user' ? 'flex justify-end' : 'flex justify-start';
            
            const bubble = document.createElement('div');
            bubble.className = sender === 'user' 
                ? 'bg-[#1a4789] text-white p-3 rounded-2xl shadow-sm max-w-[80%]' 
                : 'bg-white border border-slate-200 p-3 rounded-2xl shadow-sm max-w-[80%] text-slate-800';
            
            bubble.innerText = text;
            msgDiv.appendChild(bubble);
            container.appendChild(msgDiv);
            container.scrollTop = container.scrollHeight;
        }

        document.getElementById('user-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });
    </script>
</body>
</html>
