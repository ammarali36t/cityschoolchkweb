<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resources | TCS Chakwal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" type="image/png" href="./assets/favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .animate-fade-up {
            animation: fadeUp 0.5s ease-out forwards;
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .class-btn { -webkit-tap-highlight-color: transparent; }
    </style>
</head>
<body class="bg-slate-50">

    <nav class="bg-white border-b-4 border-[#ffed00] sticky top-0 z-50 px-4 py-3">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <img src="./assets/logo.png" alt="TCS Logo" class="h-10 md:h-16 w-auto">
                <div class="flex flex-col">
                    <span class="text-[#1a4789] font-bold text-base md:text-xl leading-none">The City School</span>
                    <span class="text-[#1a4789] text-[8px] md:text-[10px] tracking-[0.2em] font-black uppercase">Chakwal Campus</span>
                </div>
            </div>
            <div class="flex space-x-4">
                <a href="index.html" class="bg-[#1a4789] text-white px-4 py-2 rounded-full text-[10px] md:text-xs font-black uppercase hover:bg-[#ffed00] hover:text-[#1a4789] transition shadow-md">
                    <i class="fas fa-home mr-1"></i> Home
                </a>
            </div>
        </div>
    </nav>

    <header class="py-12 md:py-20 bg-[#1a4789] text-center px-4">
        <h1 class="text-[#ffed00] font-black text-4xl md:text-7xl uppercase tracking-tighter italic mb-4">Academic Resources</h1>
        <p class="text-blue-100 uppercase tracking-[0.3em] text-[10px] md:text-xs font-bold">Past Papers • Syllabi • Learning Material</p>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-12 md:py-16">
        
        <section class="mb-12">
            <div class="flex items-center space-x-4 mb-8">
                <div class="bg-[#ffed00] text-[#1a4789] w-10 h-10 rounded-xl flex items-center justify-center font-black shadow-lg">1</div>
                <h2 class="text-[#1a4789] font-black text-xl md:text-2xl uppercase tracking-tight">Select Grade</h2>
            </div>
            
            <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-4">
                <button onclick="showResources('Class 9')" class="class-btn group p-6 bg-white border-2 border-slate-100 rounded-[2rem] hover:border-[#1a4789] hover:shadow-xl transition-all text-center">
                    <span class="block text-slate-400 font-bold text-[10px] uppercase mb-1">O Levels</span>
                    <span class="block text-[#1a4789] font-black text-xl">Class 9</span>
                </button>
                <button onclick="showResources('Class 10')" class="class-btn group p-6 bg-white border-2 border-slate-100 rounded-[2rem] hover:border-[#1a4789] hover:shadow-xl transition-all text-center">
                    <span class="block text-slate-400 font-bold text-[10px] uppercase mb-1">O Levels</span>
                    <span class="block text-[#1a4789] font-black text-xl">Class 10</span>
                </button>
                <button onclick="showResources('Class 11')" class="class-btn group p-6 bg-white border-2 border-slate-100 rounded-[2rem] hover:border-[#1a4789] hover:shadow-xl transition-all text-center">
                    <span class="block text-slate-400 font-bold text-[10px] uppercase mb-1">O Levels</span>
                    <span class="block text-[#1a4789] font-black text-xl">Class 11</span>
                </button>
            </div>
        </section>

        <section id="resource-box" class="hidden opacity-0 translate-y-10 transition-all duration-500">
            <div class="flex items-center space-x-4 mb-8 pt-8 border-t-2 border-slate-100">
                <div class="bg-[#ffed00] text-[#1a4789] w-10 h-10 rounded-xl flex items-center justify-center font-black shadow-lg">2</div>
                <h2 id="resource-title" class="text-[#1a4789] font-black text-xl md:text-2xl uppercase tracking-tight italic"></h2>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 md:gap-10">
                <div class="bg-[#1a4789] p-8 rounded-[2.5rem] shadow-2xl">
                    <h3 class="text-white font-black uppercase tracking-widest text-xs mb-6 flex items-center">
                        <i class="fab fa-google-drive text-[#ffed00] mr-3 text-lg"></i> Past Papers (Drive)
                    </h3>
                    <div class="space-y-3">
                        <a href="#" class="flex items-center justify-between p-4 bg-white/5 rounded-xl hover:bg-[#ffed00] group transition-all">
                            <span class="text-white group-hover:text-[#1a4789] font-bold text-sm">Computer Science</span>
                            <i class="fas fa-link text-white/20 group-hover:text-[#1a4789]"></i>
                        </a>
                        <a href="#" class="flex items-center justify-between p-4 bg-white/5 rounded-xl hover:bg-[#ffed00] group transition-all">
                            <span class="text-white group-hover:text-[#1a4789] font-bold text-sm">Mathematics</span>
                            <i class="fas fa-link text-white/20 group-hover:text-[#1a4789]"></i>
                        </a>
                    </div>
                </div>

                <div class="bg-white p-8 rounded-[2.5rem] border-2 border-slate-100 shadow-xl">
                    <h3 class="text-[#1a4789] font-black uppercase tracking-widest text-xs mb-6 flex items-center">
                        <i class="fas fa-file-pdf text-red-500 mr-3 text-lg"></i> Course Syllabus
                    </h3>
                    <p class="text-slate-500 text-sm mb-8">Official syllabus documents uploaded by campus teachers.</p>
                    <button class="w-full bg-slate-100 text-[#1a4789] py-4 rounded-xl font-black uppercase tracking-widest text-[10px] hover:bg-[#1a4789] hover:text-white transition-all">
                        Download PDF <i class="fas fa-download ml-2"></i>
                    </button>
                </div>
            </div>
        </section>
    </main>

    <footer class="bg-[#1a4789] py-10 border-t-8 border-[#ffed00] text-center">
        <p class="text-[#ffed00] font-black tracking-[0.3em] uppercase italic">I Am - To Learn</p>
    </footer>

    <script>
        function showResources(name) {
            const box = document.getElementById('resource-box');
            const title = document.getElementById('resource-title');
            
            title.innerText = name + " Resources";
            box.classList.remove('hidden');
            
            setTimeout(() => {
                box.classList.remove('opacity-0', 'translate-y-10');
                box.classList.add('opacity-100', 'translate-y-0');
                box.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }, 10);
        }
    </script>

</body>
</html>
