<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resources | TCS Chakwal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" type="image/png" href="./assets/favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .animate-fade-up { animation: fadeUp 0.4s ease-out forwards; }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .class-btn { -webkit-tap-highlight-color: transparent; outline: none; }
    </style>
</head>
<body class="bg-slate-50">

    <nav class="bg-white border-b-4 border-[#ffed00] sticky top-0 z-50 px-4 py-3">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <img src="./assets/logo.png" alt="TCS Logo" class="h-10 md:h-16 w-auto">
                <div class="flex flex-col">
                    <span class="text-[#1a4789] font-bold text-base md:text-xl leading-none">The City School</span>
                    <span class="text-[#1a4789] text-[8px] md:text-[10px] tracking-[0.2em] font-black uppercase">Chakwal Campus</span>
                </div>
            </div>
            <a href="index.html" class="bg-[#1a4789] text-white px-5 py-2 rounded-full text-xs font-black uppercase tracking-widest hover:bg-[#ffed00] hover:text-[#1a4789] transition shadow-md">
                <i class="fas fa-home mr-2"></i> Home
            </a>
        </div>
    </nav>

    <header class="py-16 bg-[#1a4789] text-center px-4">
        <h1 class="text-[#ffed00] font-black text-4xl md:text-6xl uppercase tracking-tighter italic mb-4">Academic Resources</h1>
        <p class="text-blue-100 uppercase tracking-[0.3em] text-[10px] md:text-xs font-bold">Past Papers & Syllabi Portal</p>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-12">
        
        <section class="mb-12">
            <h2 class="text-[#1a4789] font-black text-xl uppercase mb-8 flex items-center">
                <span class="bg-[#ffed00] w-8 h-8 rounded-lg flex items-center justify-center mr-3 text-sm">1</span>
                Select Your Level
            </h2>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <button onclick="updateResources('Senior I')" class="class-btn group p-8 bg-white border-2 border-slate-100 rounded-[2rem] hover:border-[#1a4789] hover:shadow-xl transition-all">
                    <span class="block text-[#1a4789] font-black text-2xl">Senior I</span>
                    <span class="text-slate-400 text-[10px] font-bold uppercase tracking-widest">O Levels Year 1</span>
                </button>
                <button onclick="updateResources('Senior II')" class="class-btn group p-8 bg-white border-2 border-slate-100 rounded-[2rem] hover:border-[#1a4789] hover:shadow-xl transition-all">
                    <span class="block text-[#1a4789] font-black text-2xl">Senior II</span>
                    <span class="text-slate-400 text-[10px] font-bold uppercase tracking-widest">O Levels Year 2</span>
                </button>
                <button onclick="updateResources('Senior III')" class="class-btn group p-8 bg-white border-2 border-slate-100 rounded-[2rem] hover:border-[#1a4789] hover:shadow-xl transition-all">
                    <span class="block text-[#1a4789] font-black text-2xl">Senior III</span>
                    <span class="text-slate-400 text-[10px] font-bold uppercase tracking-widest">O Levels Year 3</span>
                </button>
            </div>
        </section>

        <section id="resource-display" class="hidden animate-fade-up">
            <h2 id="display-title" class="text-[#1a4789] font-black text-2xl uppercase mb-8 italic border-b-4 border-slate-100 pb-4"></h2>
            
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                <div class="bg-[#1a4789] p-8 rounded-[3rem] shadow-2xl">
                    <div class="flex items-center mb-8">
                        <i class="fab fa-google-drive text-[#ffed00] text-2xl mr-4"></i>
                        <h3 class="text-white font-black uppercase tracking-widest text-sm">Past Papers Repository</h3>
                    </div>
                    <div id="subject-list" class="grid grid-cols-1 gap-3">
                        </div>
                </div>

                <div class="bg-white p-8 rounded-[3rem] border-2 border-slate-100 shadow-xl flex flex-col justify-between">
                    <div>
                        <div class="flex items-center mb-8">
                            <i class="fas fa-file-invoice text-[#1a4789] text-2xl mr-4"></i>
                            <h3 class="text-[#1a4789] font-black uppercase tracking-widest text-sm">Course Syllabus</h3>
                        </div>
                        <p class="text-slate-500 font-medium mb-8">Download the latest syllabus updates and course outlines for your selected grade.</p>
                    </div>
                    <a id="syllabus-download" href="#" class="w-full text-center bg-[#1a4789] text-[#ffed00] py-5 rounded-2xl font-black uppercase text-xs tracking-widest hover:bg-[#ffed00] hover:text-[#1a4789] transition-all">
                        Download All Syllabi <i class="fas fa-download ml-2"></i>
                    </a>
                </div>
            </div>
        </section>
    </main>

    <footer class="bg-[#1a4789] py-10 text-center">
        <p class="text-[#ffed00] font-black tracking-widest italic uppercase">I Am - To Learn</p>
    </footer>

    <script>
        // Subject configuration for each grade
        const grades = {
            "Senior I": ["Islamiat", "Pak Studies", "Urdu", "English", "Computer Science", "Maths", "Chemistry", "Physics"],
            "Senior II": ["Islamiat", "Pak Studies", "Urdu", "English", "Computer Science", "Maths", "Chemistry", "Physics"],
            "Senior III": ["English", "Computer Science", "Maths", "Chemistry", "Physics"]
        };

        // Placeholder for your actual Google Drive links
        const driveLinks = {
            "Islamiat": "#",
            "Pak Studies": "#",
            "Urdu": "#",
            "English": "#",
            "Computer Science": "#",
            "Maths": "#",
            "Chemistry": "#",
            "Physics": "#"
        };

        function updateResources(level) {
            const display = document.getElementById('resource-display');
            const title = document.getElementById('display-title');
            const listContainer = document.getElementById('subject-list');

            // Update UI
            title.innerText = level + " Resources";
            display.classList.remove('hidden');

            // Clear previous list
            listContainer.innerHTML = '';

            // Inject new subjects with icons and links
            grades[level].forEach(subject => {
                const link = document.createElement('a');
                link.href = driveLinks[subject] || "#";
                link.target = "_blank";
                link.className = "flex items-center justify-between p-5 bg-white/5 border border-white/10 rounded-2xl hover:bg-[#ffed00] group transition-all duration-300";
                link.innerHTML = `
                    <span class="text-white group-hover:text-[#1a4789] font-bold uppercase text-sm tracking-tight">${subject}</span>
                    <i class="fas fa-external-link-alt text-white/30 group-hover:text-[#1a4789] text-sm"></i>
                `;
                listContainer.appendChild(link);
            });

            // Smooth Scroll
            display.scrollIntoView({ behavior: 'smooth' });
        }
    </script>
</body>
</html>
