            <a href="calendar.html" class="text-[#1a4789] font-black hover:text-[#ffed00] transition text-[11px] xl:text-xs uppercase">Calendar</a>

<main class="py-16 md:py-24">
    <div class="max-w-7xl mx-auto px-4">
        
        <div class="flex flex-col md:flex-row md:items-center justify-between mb-16 gap-6">
            <div>
                <a href="gallery.html" class="text-[#1a4789] font-black uppercase text-[10px] tracking-widest hover:text-[#ffed00] transition flex items-center mb-4">
                    <i class="fas fa-arrow-left mr-2"></i> Back to Campuses
                </a>
                <h1 class="text-[#1a4789] font-black text-4xl md:text-5xl uppercase tracking-tighter italic">
                    Lake Valley Campus <span class="text-[#ffed00]">Gallery</span>
                </h1>
                <div class="h-1 w-20 bg-[#ffed00] mt-4"></div>
            </div>
            <div class="bg-white px-8 py-4 rounded-2xl shadow-sm border-l-4 border-[#1a4789]">
                <p class="text-[#1a4789] font-black text-xs uppercase tracking-widest">Total Memories: <span id="memory-counter" class="text-gray-400">00</span></p>
            </div>
        </div>

        <div id="gallery-container" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
            <div class="animate-pulse aspect-square bg-slate-200 rounded-3xl"></div>
            <div class="animate-pulse aspect-square bg-slate-200 rounded-3xl"></div>
            <div class="animate-pulse aspect-square bg-slate-200 rounded-3xl"></div>
            <div class="animate-pulse aspect-square bg-slate-200 rounded-3xl"></div>
        </div>
    </div>
</main>

<footer class="bg-[#1a4789] text-white pt-16 pb-8">
    <div class="max-w-7xl mx-auto px-4 text-center">
        <h4 class="text-[#ffed00] font-black text-lg md:text-xl tracking-[0.4em] uppercase mb-2">I AM - TO LEARN</h4>
        <p class="text-blue-200/60 text-[10px] uppercase tracking-[0.2em]">© 2026 TCS Chakwal Campus.</p>
    </div>
</footer>

<script>
    // Navigation
    const btn = document.getElementById('mobile-menu-button');
    const menu = document.getElementById('mobile-menu');
    btn.addEventListener('click', () => menu.classList.toggle('hidden'));

    // Lightbox Logic
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightbox-img');

    function openLightbox(src) {
        lightboxImg.src = src;
        lightbox.classList.remove('hidden');
        setTimeout(() => {
            lightbox.classList.add('opacity-100');
            lightboxImg.classList.remove('scale-95');
            lightboxImg.classList.add('scale-100');
        }, 10);
        document.body.style.overflow = 'hidden'; 
    }

    function closeLightbox() {
        lightbox.classList.remove('opacity-100');
        lightboxImg.classList.add('scale-95');
        setTimeout(() => {
            lightbox.classList.add('hidden');
        }, 300);
        document.body.style.overflow = 'auto'; 
    }

    lightbox.addEventListener('click', (e) => {
        if (e.target === lightbox) closeLightbox();
    });

    // Data Fetching
    async function fetchLakeValleyGallery() {
        const container = document.getElementById('gallery-container');
        const counter = document.getElementById('memory-counter');
        
        const repoOwner = "ammarali36t";
        const repoName = "cityschoolchkweb";
        const folderPath = "content/gallery/lakevalley";

        try {
            const response = await fetch(`https://api.github.com/repos/${repoOwner}/${repoName}/contents/${folderPath}`);
            if (!response.ok) throw new Error("Folder not found");
            
            const entries = await response.json();
            const jsonFiles = entries.filter(file => file.name.endsWith('.json') || file.name.endsWith('.md'));
            
            counter.innerText = jsonFiles.length < 10 ? `0${jsonFiles.length}` : jsonFiles.length;
            container.innerHTML = '';

            for (const file of jsonFiles) {
                const dataResponse = await fetch(file.download_url);
                let contents;
                
                if (file.name.endsWith('.json')) {
                    contents = await dataResponse.json();
                } else {
                    const text = await dataResponse.text();
                    const match = text.match(/image:\s*["']?([^"'\n]+)["']?/);
                    contents = match ? { image: match[1] } : {};
                }
                
                if (contents.image) {
                    // KEEP FIX: Converts root relative paths to relative syntax cleanly for production mobile engines
                    let sanitizedImgPath = contents.image;
                    if (sanitizedImgPath.startsWith('/')) {
                        sanitizedImgPath = '.' + sanitizedImgPath;
                    } else if (!sanitizedImgPath.startsWith('.')) {
                        sanitizedImgPath = './' + sanitizedImgPath;
                    }

                    const card = document.createElement('div');
                    card.className = "group relative aspect-square overflow-hidden rounded-3xl bg-slate-200 shadow-md cursor-pointer";
                    card.onclick = () => openLightbox(sanitizedImgPath);
                    card.innerHTML = `
                        <img src="${sanitizedImgPath}" class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-110">
                        <div class="absolute inset-0 bg-[#1a4789]/60 opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex items-center justify-center">
                            <i class="fas fa-search-plus text-white text-2xl"></i>
                        </div>
                    `;
                    container.appendChild(card);
                }
            }
            
            // Add the placeholder card at the end
            const placeholder = document.createElement('div');
            placeholder.className = "aspect-square border-4 border-dashed border-slate-200 rounded-3xl flex flex-col items-center justify-center text-slate-300";
            placeholder.innerHTML = `<i class="fas fa-cloud-upload-alt text-4xl mb-2"></i><span class="text-[10px] font-bold uppercase tracking-widest">Awaiting Uploads</span>`;
            container.appendChild(placeholder);

        } catch (err) {
            console.error(err);
            container.innerHTML = '<p class="text-slate-400">Unable to load images.</p>';
        }
    }

    document.addEventListener("DOMContentLoaded", fetchLakeValleyGallery);
</script>
</body>
</html>
