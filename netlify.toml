[build]
  command = "node compile-data.js && npm install"
  functions = "netlify/functions"
  publish = "."

[functions]
  # This tells Netlify where the code is
  directory = "netlify/functions"

[functions.node_bundle]
  # This forces the AI library to be included in the bundle
  external_node_modules = ["@google/generative-ai"]
