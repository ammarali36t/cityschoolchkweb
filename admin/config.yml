backend:
  name: git-gateway
  branch: main 

media_folder: "assets/uploads"
public_folder: "/assets/uploads"

collections:
  - name: "staff_members"
    label: "Our Faculty"
    folder: "content/faculty"
    create: true
    format: "json"
    extension: "json"
    slug: "{{title}}"
    fields:
      - {label: "Teacher Name", name: "title", widget: "string"}
      - {label: "Designation/Role", name: "role", widget: "string"}
      - {label: "Profile Picture", name: "image", widget: "image"}
      - {label: "Experience", name: "order", widget: "number", default: 1}
      - {label: "Is this Headmistress?", name: "is_head", widget: "boolean", default: false}

  - name: "high_achievers"
    label: "High Achievers"
    folder: "content/achievers"
    create: true
    format: "json"
    extension: "json"
    slug: "{{title}}"
    fields:
      - {label: "Student Name", name: "title", widget: "string"}
      - {label: "Grade/Class", name: "student_grade", widget: "select", options: ["Senior III", "Senior II", "Senior I", "Grade 8", "Grade 7", "Grade 6", "Grade 5", "Grade 4", "Grade 3", "Grade 2", "Grade 1"]}
      - label: "Result/Grade"
        name: "result"
        widget: "string"
        pattern: ['^[^b-zB-Z]*[Aa][^b-zB-Z]*$', "Only A or A* allowed for Senior levels."]
      - {label: "Percentage", name: "percentage", widget: "string", required: false}
      - {label: "Student Photo", name: "image", widget: "image"}
      - {label: "Display Order", name: "order", widget: "number", default: 1}

  - name: "syllabi"
    label: "Course Syllabi"
    folder: "content/syllabi"
    extension: "json" 
    create: false 
    editor:
      preview: false
    description: >
      INSTRUCTIONS FOR IT TEAM: 
      1. Select the Grade Level you want to update.
      2. Upload the PDF file.
      3. IMPORTANT: The file MUST be named exactly like the grade (e.g., 'grade6.pdf', 'senior1.pdf') for the download button to work.
    fields:
      - label: "Grade Level"
        name: "title"
        widget: "select"
        options:
          - "Grade 3"
          - "Grade 4"
          - "Grade 5"
          - "Grade 6"
          - "Grade 7"
          - "Grade 8"
          - "Senior I"
          - "Senior II"
          - "Senior III"
      - label: "Syllabus PDF"
        name: "file"
        widget: "file"
        media_folder: "/syllabi"
        choose_url: false
        hint: "Upload PDF here. Ensure filename is lowercase and matches the grade (e.g., grade7.pdf)"

  - name: "gallery_chakwal"
    label: "Gallery: Chakwal Campus"
    folder: "content/gallery/chakwal"
    create: true
    extension: json
    fields:
      - { label: "Upload Image", name: "image", widget: "image", media_folder: "/assets/images/gallery/chakwal" }
      - { label: "Upload Date", name: "date", widget: "datetime", default: "", required: false }

  - name: "gallery_lakevalley"
    label: "Gallery: Lake Valley Campus"
    folder: "content/gallery/lakevalley"
    create: true
    extension: json
    fields:
      - { label: "Upload Image", name: "image", widget: "image", media_folder: "/assets/images/gallery/lakevalley" }
      - { label: "Upload Date", name: "date", widget: "datetime", default: "", required: false }

  - name: "student_life"
    label: "Student's Life Media"
    folder: "content/student-life"
    create: true
    format: "json"
    extension: "json"
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    
    # FIX: Configures view filters to explicitly bind the image file object to the thumbnail container loop
    view_filters:
      - label: "Photos Only"
        field: mediaType
        pattern: "image"
      - label: "Videos Only"
        field: mediaType
        pattern: "video"
    
    # Explicit mapping syntax for card layouts
    summary: "{{title}}"
    view_groups:
      - label: "Media Type"
        field: mediaType
        
    fields:
      - { label: "Title", name: "title", widget: "string", required: true }
      - { label: "Media Type Selection", name: "mediaType", widget: "select", options: ["image", "video"], required: true, hint: "Important: Choose the type first, then use the correct upload field below." }
      - { label: "Category/Activity", name: "category", widget: "string", hint: "e.g., Sports Day, Cultural Festival, Classroom", required: true }
      
      # FIX: Changed variable target name directly to 'image' so Decap picks it up for the dashboard view automatically
      - label: "Upload Image File"
        name: "image"
        widget: "image"
        required: false
        hint: "Use ONLY for Photos."
        pattern: ['.*\.(jpg|jpeg|png|webp|gif)$', "ERROR: You selected a video file. Please use the Video field below for .mp4 files."]

      # Video Field with Validation Guardrail
      - label: "Upload Video File"
        name: "videoFile"
        widget: "file"
        required: false
        hint: "Use ONLY for Videos (.mp4)."
        pattern: ['.*\.(mp4|webm|ogg)$', "ERROR: You uploaded an image here. Please use the 'Upload Image File' field above instead."]

      - { label: "Date Uploaded", name: "date", widget: "datetime", required: true }
