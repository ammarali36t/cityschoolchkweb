backend:
  name: git-gateway
  branch: main 

media_folder: "assets/uploads"
public_folder: "/assets/uploads"

collections:
  - name: "staff_members"
    label: "Our Faculty"
    folder: "content/faculty"
    create: true
    format: "json"
    extension: "json"
    slug: "{{title}}"
    fields:
      - {label: "Teacher Name", name: "title", widget: "string"}
      - {label: "Designation/Role", name: "role", widget: "string"}
      - {label: "Profile Picture", name: "image", widget: "image"}
      - {label: "Experience", name: "order", widget: "number", default: 1}
      - {label: "Is this Headmistress?", name: "is_head", widget: "boolean", default: false}

  - name: "high_achievers"
    label: "High Achievers"
    folder: "content/achievers"
    create: true
    format: "json"
    extension: "json"
    slug: "{{title}}"
    fields:
      - {label: "Student Name", name: "title", widget: "string"}
      - {label: "Grade/Class", name: "student_grade", widget: "select", options: ["Senior III", "Senior II", "Senior I", "Grade 8", "Grade 7", "Grade 6", "Grade 5", "Grade 4", "Grade 3", "Grade 2", "Grade 1"]}
      - label: "Result/Grade"
        name: "result"
        widget: "string"
        pattern: ['^[^b-zB-Z]*[Aa][^b-zB-Z]*$', "Only A or A* allowed for Senior levels."]
      - {label: "Percentage", name: "percentage", widget: "string", required: false}
      - {label: "Student Photo", name: "image", widget: "image"}
      - {label: "Display Order", name: "order", widget: "number", default: 1}

  - name: "syllabi"
    label: "Course Syllabi"
    folder: "content/syllabi" # This is where the data files will live
    create: false # Set to false because we only have 6 specific grades
    slug: "{{title}}"
    fields:
      - { label: "Grade Level", name: "title", widget: "string", readonly: true }
      - { label: "Syllabus PDF", name: "file", widget: "file", media_folder: "/assets/syllabi" }
