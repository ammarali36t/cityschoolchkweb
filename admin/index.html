<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TCS Chakwal | Content Manager</title>
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>

  <style>
    /* ==========================================
       1. LAPTOP/PC STAYS UNTOUCHED - MOBILE-ONLY FIX 
       ========================================== */
    @media (max-width: 640px) {
      /* Force the main outer Netlify container widget to drop full width */
      iframe#netlify-identity-widget,
      div[id*="netlify-identity-widget"] {
        width: 100% !important;
        height: 100% !important;
        left: 0 !important;
        top: 0 !important;
        right: 0 !important;
        bottom: 0 !important;
      }

      /* Force the dialog panel wrapper to fit within phone screen bounds */
      div[id*="netlify-identity-widget"] .netlify-identity-menu,
      iframe#netlify-identity-widget .netlify-identity-menu {
        max-width: 92vw !important;
        width: 92vw !important;
        margin: 20px auto !important;
        box-sizing: border-box !important;
      }
    }

    /* ==========================================
       2. YOUR EXISTING INTERNAL DASHBOARD REWRITES 
       ========================================== */
    @media (max-width: 768px) {
      /* Stops the sidebar from floating rigidly over the input fields */
      div[class*="AppHeaderContainer"] + div {
        flex-direction: column !important;
        display: flex !important;
      }
      
      /* Flattens the collection layout box smoothly across the top of the mobile screen */
      aside[class*="SidebarContainer"] {
        width: 100% !important;
        position: relative !important;
        min-width: 100% !important;
        max-width: 100% !important;
        margin-bottom: 16px !important;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05) !important;
      }

      /* Forces the menu items to flow responsively rather than cutting off */
      aside[class*="SidebarContainer"] nav {
        width: 100% !important;
      }
    }
  </style>
</head>
<body>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
</body>
</html>
