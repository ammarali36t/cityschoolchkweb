<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TCS Chakwal | Content Manager</title>
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>

  <style>
    /* ==========================================
       1. STYLES ONLY FOR MOBILE (UNDER 768px)
       ========================================== */
    @media (max-width: 768px) {
      
      /* FIX FOR THE TOP TOOLBAR (PUBLISH BUTTON CONTAINER) */
      /* This breaks the rigid row layout and lets buttons wrap so they stay on screen */
      div[class*="AppHeaderContent"],
      div[class*="TopBarContainer"],
      header div {
        flex-wrap: wrap !important;
        gap: 8px !important;
        height: auto !important;
        padding: 8px !important;
      }

      /* Forces the action buttons container (Publish, Delete, Status dropdown) to fit inside the viewport */
      div[class*="ToolbarContainer"] {
        width: 100% !important;
        max-width: 100% !important;
        display: flex !important;
        flex-wrap: wrap !important;
        justify-content: flex-start !important;
        gap: 6px !important;
        position: relative !important;
        left: 0 !important;
      }

      /* Adjusts individual buttons inside the header bar so they don't break look or flow */
      div[class*="ToolbarContainer"] button,
      div[class*="ToolbarContainer"] div[role="button"],
      a[class*="AppHeaderButton"] {
        padding: 6px 10px !important;
        font-size: 12px !important;
      }

      /* Stops the sidebar from floating rigidly over the input fields */
      div[class*="AppHeaderContainer"] + div {
        flex-direction: column !important;
        display: flex !important;
      }
      
      /* Flattens the collection layout box smoothly across the top of the mobile screen */
      aside[class*="SidebarContainer"] {
        width: 100% !important;
        position: relative !important;
        min-width: 100% !important;
        max-width: 100% !important;
        margin-bottom: 16px !important;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05) !important;
      }

      /* Forces the menu items to flow responsively rather than cutting off */
      aside[class*="SidebarContainer"] nav {
        width: 100% !important;
      }

      /* FIX FOR THE IMAGE UPLOAD MODAL WINDOW */
      div[class*="Modal-card"], 
      div[role="dialog"] {
        width: 95vw !important;
        min-width: 95vw !important;
        max-width: 95vw !important;
        margin: 10px auto !important;
        padding: 12px !important;
        left: 50% !important;
        transform: translateX(-50%) !important;
      }

      div[class*="StyledModalCardBody"] > div,
      div[class*="Modal"] div {
        flex-wrap: wrap !important;
        gap: 8px !important;
      }

      div[class*="CardGridContainer"] {
        grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)) !important;
        gap: 8px !important;
        padding: 4px !important;
      }
    }
  </style>
</head>
<body>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
</body>
</html>
