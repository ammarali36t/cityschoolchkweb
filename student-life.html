<header class="bg-[#1a4789] text-white py-14 border-b-8 border-[#ffed00]">

        <p class="text-blue-200 text-xs md:text-sm uppercase tracking-[0.3em] font-bold">Photos & Highlights From Our Campuses</p>
    </div>
</header>

<div class="flex justify-center space-x-2 md:space-x-4 mt-12 px-4">
    <button onclick="filterMedia('all')" id="tab-all" class="px-6 py-2 rounded-full font-black text-xs uppercase tracking-wider transition bg-[#1a4789] text-white shadow-md">All Media</button>
    <button onclick="filterMedia('image')" id="tab-image" class="px-6 py-2 rounded-full font-black text-xs uppercase tracking-wider transition bg-white text-[#1a4789] border border-slate-200 hover:bg-slate-100">Photos</button>
    <button onclick="filterMedia('video')" id="tab-video" class="px-6 py-2 rounded-full font-black text-xs uppercase tracking-wider transition bg-white text-[#1a4789] border border-slate-200 hover:bg-slate-100">Videos</button>
</div>

<main class="flex-grow py-12">
    <div class="max-w-7xl mx-auto px-4">
        <div id="media-container" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
            <div class="animate-pulse h-64 bg-slate-200 rounded-3xl"></div>
            <div class="animate-pulse h-64 bg-slate-200 rounded-3xl"></div>
        </div>
    </div>
</main>

<footer class="bg-[#1a4789] text-white pt-12 pb-6 border-t border-blue-900/40 mt-auto">
    <div class="max-w-7xl mx-auto px-4 text-center">
        <h4 class="text-[#ffed00] font-black text-sm tracking-[0.4em] uppercase mb-2">I AM - TO LEARN</h4>
        <p class="text-blue-200/50 text-[9px] uppercase tracking-[0.2em]">© 2026 TCS Chakwal Campus.</p>
    </div>
</footer>

<script>
    // Mobile Hamburger Menu Setup
    const mobileBtn = document.getElementById('mobile-menu-button');
    const mobileMenu = document.getElementById('mobile-menu');
    if(mobileBtn && mobileMenu) {
        mobileBtn.addEventListener('click', () => {
            mobileMenu.classList.toggle('hidden');
        });
    }

    const lightbox = document.getElementById('media-lightbox');
    const lbImg = document.getElementById('lightbox-img');
    const lbVideo = document.getElementById('lightbox-video');
    const lbCategory = document.getElementById('lightbox-category');
    const lbTitle = document.getElementById('lightbox-title');

    let allMediaItems = [];

    function openLightbox(mediaType, src, category, title) {
        lbCategory.innerText = category || '';
        lbTitle.innerText = title || '';

        if (mediaType === 'image') {
            lbVideo.classList.add('hidden');
            lbVideo.src = '';
            lbImg.src = src;
            lbImg.classList.remove('hidden');
        } else {
            lbImg.classList.add('hidden');
            lbImg.src = '';
            lbVideo.src = src;
            lbVideo.classList.remove('hidden');
        }

        lightbox.classList.remove('hidden');
        setTimeout(() => lightbox.classList.add('opacity-100'), 10);
        document.body.style.overflow = 'hidden';
    }

    function closeLightbox() {
        lightbox.classList.remove('opacity-100');
        setTimeout(() => {
            lightbox.classList.add('hidden');
            lbVideo.pause();
        }, 300);
        document.body.style.overflow = 'auto';
    }

    // SAFELY evaluates key definitions whether passed as an Array or single string
    function parseFrontmatter(text, keys) {
        const keysArray = Array.isArray(keys) ? keys : [keys];
        for (let key of keysArray) {
            const regex = new RegExp(`^${key}:\\s*["']?([^"'\n\r]+)["']?`, 'm');
            const match = text.match(regex);
            if (match && match[1]) return match[1].trim();
        }
        return '';
    }

    async function fetchStudentLifeMedia() {
        const container = document.getElementById('media-container');
        const repoOwner = "ammarali36t";
        const repoName = "cityschoolchkweb";
        const folderPath = "content/student-life";

        try {
            const response = await fetch(`https://api.github.com/repos/${repoOwner}/${repoName}/contents/${folderPath}`);
            if (!response.ok) throw new Error("Folder structural read failed");
            
            const entries = await response.json();
            const validFiles = entries.filter(file => file.name.endsWith('.json') || file.name.endsWith('.md'));
            
            allMediaItems = [];

            const targetFields = [
                'upload_video_file', 'upload_video_file_optional', 'video', 'video_file', 'videofile',
                'upload_image_file', 'upload_image_file_optional', 'image', 'image_file', 'imagefile', 
                'media_file', 'mediafile', 'mediaUrl'
            ];

            for (const file of validFiles) {
                const dataResponse = await fetch(file.download_url);
                let itemData = {};

                if (file.name.endsWith('.json')) {
                    const parsedJson = await dataResponse.json();
                    
                    let foundMedia = '';
                    for (let key of targetFields) {
                        if (parsedJson[key]) {
                            foundMedia = parsedJson[key];
                            break;
                        }
                    }

                    const rawType = parsedJson.media_type || parsedJson.mediaType || '';
                    let finalType = 'image';
                    
                    // FIXED: Flexible case-insensitive parsing to catch all variations of video formats
                    const lowerMedia = foundMedia.toLowerCase();
                    if (rawType.toLowerCase().includes('video') || 
                        lowerMedia.includes('.mp4') || 
                        lowerMedia.includes('.webm') || 
                        lowerMedia.includes('.mov') || 
                        lowerMedia.includes('.m4v')) {
                        finalType = 'video';
                    }

                    itemData = {
                        title: parsedJson.title || 'Untitled Update',
                        mediaType: finalType,
                        category: parsedJson.category || parsedJson.category_activity || parsedJson['category/activity'] || 'Activity',
                        mediaFile: foundMedia,
                        date: parsedJson.date || parsedJson.date_uploaded || ''
                    };
                } else {
                    const textContent = await dataResponse.text();
                    const computedType = parseFrontmatter(textContent, ['media_type', 'mediaType']) || '';
                    const foundMedia = parseFrontmatter(textContent, targetFields);

                    let finalType = 'image';
                    const lowerMedia = foundMedia.toLowerCase();
                    if (computedType.toLowerCase().includes('video') || 
                        lowerMedia.includes('.mp4') || 
                        lowerMedia.includes('.webm') || 
                        lowerMedia.includes('.mov') || 
                        lowerMedia.includes('.m4v')) {
                        finalType = 'video';
                    }

                    itemData = {
                        title: parseFrontmatter(textContent, ['title']) || 'Untitled Update',
                        mediaType: finalType,
                        category: parseFrontmatter(textContent, ['category', 'category_activity', 'category/activity']) || 'Activity',
                        mediaFile: foundMedia,
                        date: parseFrontmatter(textContent, ['date', 'date_uploaded'])
                    };
                }

                if (itemData.mediaFile) {
                    let sanitizedPath = itemData.mediaFile.trim();
                    if (sanitizedPath.startsWith('/')) {
                        sanitizedPath = '.' + sanitizedPath;
                    } else if (!sanitizedPath.startsWith('.') && !sanitizedPath.startsWith('http')) {
                        sanitizedPath = './' + sanitizedPath;
                    }
                    itemData.mediaFile = sanitizedPath;
                    allMediaItems.push(itemData);
                }
            }

            allMediaItems.sort((a, b) => new Date(b.date || 0) - new Date(a.date || 0));
            renderItems(allMediaItems);

        } catch (err) {
            console.error("Fetch operational failure details: ", err);
            container.innerHTML = '<p class="text-slate-400 text-center col-span-full">Unable to load student life updates.</p>';
        }
    }

    function renderItems(items) {
        const container = document.getElementById('media-container');
        container.innerHTML = '';

        if(items.length === 0) {
            container.innerHTML = '<p class="text-slate-400 text-center col-span-full py-12">No media items found.</p>';
            return;
        }

        items.forEach(item => {
            const card = document.createElement('div');
            card.className = "group relative h-72 overflow-hidden rounded-3xl bg-slate-900 shadow-lg cursor-pointer transition-all duration-300 hover:-translate-y-1";
            card.onclick = () => openLightbox(item.mediaType, item.mediaFile, item.category, item.title);

            let visualElement = '';
            if (item.mediaType === 'image') {
                visualElement = `<img src="${item.mediaFile}" class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-105" onerror="this.src='./assets/logo.png'; this.className='w-full h-full object-contain p-12 bg-slate-800';">`;
            } else {
                visualElement = `
                    <video src="${item.mediaFile}" muted loop playsinline class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-105" 
                           onmouseenter="this.play()" onmouseleave="this.pause(); this.currentTime = 0;"></video>
                    <div class="absolute top-4 right-4 bg-black/60 backdrop-blur-md px-3 py-1 rounded-full text-white text-[10px] font-black uppercase tracking-widest flex items-center z-10">
                        <i class="fas fa-play mr-1.5 text-[#ffed00]"></i> Video
                    </div>
                `;
            }

            card.innerHTML = `
                ${visualElement}
                <div class="absolute inset-0 bg-gradient-to-t from-[#1a4789]/95 via-[#1a4789]/40 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex flex-col justify-end p-6">
                    <span class="text-[#ffed00] font-black uppercase text-[11px] tracking-wider mb-1">
                        ${item.category}
                    </span>
                    <h3 class="text-white font-bold text-base tracking-tight leading-snug">
                        ${item.title}
                    </h3>
                </div>
            `;
            container.appendChild(card);
        });
    }

    function filterMedia(type) {
        ['all', 'image', 'video'].forEach(t => {
            const btn = document.getElementById(`tab-${t}`);
            if(btn) {
                if(t === type) {
                    btn.className = "px-6 py-2 rounded-full font-black text-xs uppercase tracking-wider transition bg-[#1a4789] text-white shadow-md";
                } else {
                    btn.className = "px-6 py-2 rounded-full font-black text-xs uppercase tracking-wider transition bg-white text-[#1a4789] border border-slate-200 hover:bg-slate-100";
                }
            }
        });

        if (type === 'all') {
            renderItems(allMediaItems);
        } else {
            const filtered = allMediaItems.filter(item => item.mediaType === type);
            renderItems(filtered);
        }
    }

    document.addEventListener("DOMContentLoaded", fetchStudentLifeMedia);
</script>
</body>
