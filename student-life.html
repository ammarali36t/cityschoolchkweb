<!DOCTYPE html>
<html lang="en">

<body class="bg-slate-50 flex flex-col min-h-screen">

<div id="media-lightbox" class="fixed inset-0 z-[100] hidden bg-black/95 flex flex-col items-center justify-center p-4 opacity-0">

        <i class="fas fa-times"></i>
    </button>
    <div class="relative max-w-4xl max-h-[80vh] flex items-center justify-center">
        <img id="lightbox-img" src="" class="hidden max-w-full max-h-[80vh] rounded-xl shadow-2xl transform scale-95 transition-all duration-300">
        <video id="lightbox-video" src="" controls class="hidden max-w-full max-h-[80vh] rounded-xl shadow-2xl transform scale-95 transition-all duration-300"></video>
    </div>
    <div class="text-center mt-4 px-4 max-w-xl">
        <span id="lightbox-category" class="text-[#ffed00] font-black uppercase text-xs tracking-widest block mb-1"></span>
        <h3 id="lightbox-title" class="text-white font-bold text-lg md:text-xl leading-tight"></h3>
    </div>
</div>

<nav class="bg-white border-b-4 border-[#ffed00] sticky top-0 z-50 px-4 py-3">
    <div class="max-w-7xl mx-auto flex justify-between items-center">

            <img src="./assets/logo.png" alt="TCS Logo" class="h-10 md:h-16 w-auto">
            <div class="flex flex-col">
                <span class="text-[#1a4789] font-bold text-base md:text-xl leading-none">The City School</span>
                <span class="text-[#1a4789] text-[8px] md:text-[10px] tracking-[0.2em] font-black uppercase">Chakwal Campus</span>
            </div>
        </div>
        <div class="hidden lg:flex space-x-3 xl:space-x-5 items-center">
            <a href="index.html" class="text-[#1a4789] font-black hover:text-[#ffed00] transition text-[11px] xl:text-xs uppercase">Home</a>
            <a href="achievers.html" class="text-[#1a4789] font-black hover:text-[#ffed00] transition text-[11px] xl:text-xs uppercase">High Achievers</a>
            <a href="gallery.html" class="text-[#1a4789] font-black hover:text-[#ffed00] transition text-[11px] xl:text-xs uppercase">Gallery</a>
            <a href="events.html" class="text-[#1a4789] font-black hover:text-[#ffed00] transition text-[11px] xl:text-xs uppercase text-[#ffed00]">Events</a>
            <a href="resources.html" class="text-[#1a4789] font-black hover:text-[#ffed00] transition text-[11px] xl:text-xs uppercase">Resources</a>
            <a href="calendar.html" class="text-[#1a4789] font-black hover:text-[#ffed00] transition text-[11px] xl:text-xs uppercase">Calendar</a>
            <a href="buddy.html" class="text-blue-600 font-black hover:text-[#ffed00] transition text-[11px] xl:text-xs uppercase flex items-center bg-blue-50 px-2 py-1 rounded-full"><i class="fas fa-robot mr-1"></i>CampusBuddy</a>
            <a href="staff.html" class="text-[#1a4789] font-black hover:text-[#ffed00] transition text-[11px] xl:text-xs uppercase">Staff</a>
            <a href="about.html" class="text-[#1a4789] font-black hover:text-[#ffed00] transition text-[11px] xl:text-xs uppercase">About</a>
            <a href="feedback.html" class="text-[#1a4789] font-black hover:text-[#ffed00] transition text-[11px] xl:text-xs uppercase">Feedback</a>
        </div>
        <button id="mobile-menu-button" class="lg:hidden flex items-center justify-center w-12 h-10 bg-[#1a4789] rounded-lg">
            <i class="fas fa-bars text-white text-xl"></i>
        </button>
    </div>
</nav>

<header class="bg-[#1a4789] text-white py-14 border-b-8 border-[#ffed00]">
    <div class="max-w-7xl mx-auto px-4 text-center">
        <h1 class="font-black text-4xl md:text-6xl uppercase tracking-tighter italic mb-2">Student's <span class="text-[#ffed00]">Life</span></h1>
        <p class="text-blue-200 text-xs md:text-sm uppercase tracking-[0.3em] font-bold">Photos & Highlights From Our Campuses</p>
    </div>
</header>

<div class="flex justify-center space-x-2 md:space-x-4 mt-12 px-4">
    <button onclick="filterMedia('all')" id="tab-all" class="px-6 py-2 rounded-full font-black text-xs uppercase tracking-wider transition bg-[#1a4789] text-white shadow-md">All Media</button>
    <button onclick="filterMedia('image')" id="tab-image" class="px-6 py-2 rounded-full font-black text-xs uppercase tracking-wider transition bg-white text-[#1a4789] border border-slate-200 hover:bg-slate-100">Photos</button>
    <button onclick="filterMedia('video')" id="tab-video" class="px-6 py-2 rounded-full font-black text-xs uppercase tracking-wider transition bg-white text-[#1a4789] border border-slate-200 hover:bg-slate-100">Videos</button>
</div>

<main class="flex-grow py-12">
    <div class="max-w-7xl mx-auto px-4">
        <div id="media-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
            <div class="animate-pulse h-64 bg-slate-200 rounded-3xl"></div>
            <div class="animate-pulse h-64 bg-slate-200 rounded-3xl"></div>
            <div class="animate-pulse h-64 bg-slate-200 rounded-3xl"></div>
        </div>
    </div>
</main>

<footer class="bg-[#1a4789] text-white pt-12 pb-6 border-t border-blue-900/40">
    <div class="max-w-7xl mx-auto px-4 text-center">
        <h4 class="text-[#ffed00] font-black text-sm tracking-[0.4em] uppercase mb-2">I AM - TO LEARN</h4>
        <p class="text-blue-200/50 text-[9px] uppercase tracking-[0.2em]">© 2026 TCS Chakwal Campus.</p>
    </div>
</footer>

<script>
    // Mobile Navigation Toggle
    const mobileBtn = document.getElementById('mobile-menu-button');
    const mobileMenu = document.getElementById('mobile-menu');
    if(mobileBtn && mobileMenu) {
        mobileBtn.addEventListener('click', () => mobileMenu.classList.toggle('hidden'));
    }

    // Lightbox Setup
    const lightbox = document.getElementById('media-lightbox');
    const lbImg = document.getElementById('lightbox-img');
    const lbVideo = document.getElementById('lightbox-video');
    const lbCategory = document.getElementById('lightbox-category');
    const lbTitle = document.getElementById('lightbox-title');

    let allMediaItems = [];

    function openLightbox(mediaType, src, category, title) {
        lbCategory.innerText = category || '';
        lbTitle.innerText = title || '';

        if (mediaType === 'image') {
            lbVideo.classList.add('hidden');
            lbVideo.src = '';
            lbImg.src = src;
            lbImg.classList.remove('hidden');
        } else {
            lbImg.classList.add('hidden');
            lbImg.src = '';
            lbVideo.src = src;
            lbVideo.classList.remove('hidden');
        }

        lightbox.classList.remove('hidden');
        setTimeout(() => {
            lightbox.classList.add('opacity-100');
            if(mediaType === 'image') lbImg.classList.replace('scale-95', 'scale-100');
            if(mediaType === 'video') lbVideo.classList.replace('scale-95', 'scale-100');
        }, 10);
        document.body.style.overflow = 'hidden';
    }

    function closeLightbox() {
        lightbox.classList.remove('opacity-100');
        lbImg.classList.replace('scale-100', 'scale-95');
        lbVideo.classList.replace('scale-100', 'scale-95');
        setTimeout(() => {
            lightbox.classList.add('hidden');
            lbVideo.pause();
        }, 300);
        document.body.style.overflow = 'auto';
    }

    lightbox.addEventListener('click', (e) => {
        if (e.target === lightbox || e.target.parentElement === lightbox) closeLightbox();
    });

    // Helper to extract frontmatter content values from Markdown (.md) or JSON files smoothly
    function parseFrontmatter(text, key) {
        const regex = new RegExp(`${key}:\\s*["']?([^"'\n\r]+)["']?`);
        const match = text.match(regex);
        return match ? match[1].trim() : '';
    }

    // Dynamic File Loader
    async function fetchStudentLifeMedia() {
        const container = document.getElementById('media-container');
        const repoOwner = "ammarali36t";
        const repoName = "cityschoolchkweb";
        const folderPath = "content/student-life";

        try {
            const response = await fetch(`https://api.github.com/repos/${repoOwner}/${repoName}/contents/${folderPath}`);
            if (!response.ok) throw new Error("Media directory execution error");
            
            const entries = await response.json();
            // Accepts both .json and .md files generated by Decap/Netlify CMS
            const validFiles = entries.filter(file => file.name.endsWith('.json') || file.name.endsWith('.md'));
            
            allMediaItems = [];

            for (const file of validFiles) {
                const dataResponse = await fetch(file.download_url);
                let itemData = {};

                if (file.name.endsWith('.json')) {
                    itemData = await dataResponse.json();
                } else {
                    const textContent = await dataResponse.text();
                    itemData = {
                        title: parseFrontmatter(textContent, 'title'),
                        mediaType: parseFrontmatter(textContent, 'mediaType'),
                        category: parseFrontmatter(textContent, 'category'),
                        mediaFile: parseFrontmatter(textContent, 'mediaFile'),
                        date: parseFrontmatter(textContent, 'date')
                    };
                }

                if (itemData.mediaFile) {
                    allMediaItems.push(itemData);
                }
            }

            // Sort content records by date newest first
            allMediaItems.sort((a, b) => new Date(b.date || 0) - new Date(a.date || 0));
            renderItems(allMediaItems);

        } catch (err) {
            console.error(err);
            container.innerHTML = '<p class="text-slate-400 text-center col-span-full">Unable to load student life updates.</p>';
        }
    }

    function renderItems(items) {
        const container = document.getElementById('media-container');
        container.innerHTML = '';

        if(items.length === 0) {
            container.innerHTML = '<p class="text-slate-400 text-center col-span-full py-12 font-semibold">No highlights available for this selection.</p>';
            return;
        }

        items.forEach(item => {
            const card = document.createElement('div');
            card.className = "group relative h-72 overflow-hidden rounded-3xl bg-slate-900 shadow-lg cursor-pointer transition-all duration-300 hover:-translate-y-1";
            card.onclick = () => openLightbox(item.mediaType, item.mediaFile, item.category, item.title);

            let visualElement = '';
            if (item.mediaType === 'image') {
                visualElement = `<img src="${item.mediaFile}" class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-105">`;
            } else {
                visualElement = `
                    <video src="${item.mediaFile}" muted loop playsinline class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-105" 
                           onmouseenter="this.play()" onmouseleave="this.pause(); this.currentTime = 0;"></video>
                    <div class="absolute top-4 right-4 bg-black/60 backdrop-blur-md px-3 py-1 rounded-full text-white text-[10px] font-black uppercase tracking-widest flex items-center z-10">
                        <i class="fas fa-play mr-1.5 text-[#ffed00]"></i> Video Clip
                    </div>
                `;
            }

            card.innerHTML = `
                ${visualElement}
                <div class="absolute inset-0 bg-gradient-to-t from-[#1a4789]/95 via-[#1a4789]/60 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex flex-col justify-end p-6">
                    <span class="text-[#ffed00] font-black uppercase text-[11px] tracking-[0.2em] mb-1 transform translate-y-2 group-hover:translate-y-0 transition-transform duration-300 delay-75">
                        ${item.category || 'Activity'}
                    </span>
                    <h3 class="text-white font-black uppercase text-base tracking-tight leading-snug transform translate-y-3 group-hover:translate-y-0 transition-transform duration-300 delay-100">
                        ${item.title || 'Untitled Update'}
                    </h3>
                </div>
            `;
            container.appendChild(card);
        });
    }

    function filterMedia(type) {
        ['all', 'image', 'video'].forEach(t => {
            const btn = document.getElementById(`tab-${t}`);
            if(btn) {
                if(t === type) {
                    btn.className = "px-6 py-2 rounded-full font-black text-xs uppercase tracking-wider transition bg-[#1a4789] text-white shadow-md";
                } else {
                    btn.className = "px-6 py-2 rounded-full font-black text-xs uppercase tracking-wider transition bg-white text-[#1a4789] border border-slate-200 hover:bg-slate-100";
                }
            }
        });

        if (type === 'all') {
            renderItems(allMediaItems);
        } else {
            const filtered = allMediaItems.filter(item => item.mediaType === type);
            renderItems(filtered);
        }
    }

    document.addEventListener("DOMContentLoaded", fetchStudentLifeMedia);
</script>
</body>
</html>
