<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student's Life | TCS Chakwal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" type="image/png" href="./assets/favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .animate-fade-in {
            animation: fadeIn 0.5s ease-in;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-slate-50">

    <nav class="bg-white border-b-4 border-[#ffed00] sticky top-0 z-50 px-4 py-3">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <img src="./assets/logo.png" alt="TCS Logo" class="h-10 md:h-16 w-auto">
                <div class="flex flex-col">
                    <span class="text-[#1a4789] font-bold text-base md:text-xl leading-none">The City School</span>
                    <span class="text-[#1a4789] text-[8px] md:text-[10px] tracking-[0.2em] font-black uppercase">Chakwal Campus</span>
                </div>
            </div>
            <a href="events.html" class="bg-[#1a4789] text-white px-4 py-2 rounded-full text-xs font-black uppercase tracking-widest hover:bg-[#ffed00] hover:text-[#1a4789] transition shadow-md">
                <i class="fas fa-arrow-left mr-2"></i> Back to Events
            </a>
        </div>
    </nav>

    <header class="py-16 bg-[#1a4789] text-center px-4">
        <h1 class="text-[#ffed00] font-black text-4xl md:text-6xl uppercase tracking-tighter italic mb-4">Student's Life</h1>
        <p class="text-blue-100 uppercase tracking-[0.3em] text-[10px] md:text-xs font-bold">Photos & Highlights from our Campuses</p>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-16">
        
        <div class="flex flex-wrap justify-center gap-4 mb-12">
            <button onclick="filterMedia('all')" class="filter-btn bg-[#1a4789] text-white px-8 py-2.5 rounded-full text-xs font-bold uppercase tracking-widest transition-all shadow-lg active:scale-95">
                All Media
            </button>
            <button onclick="filterMedia('photos')" class="filter-btn bg-white text-[#1a4789] border border-blue-100 px-8 py-2.5 rounded-full text-xs font-bold uppercase tracking-widest transition-all hover:bg-blue-50 active:scale-95">
                Photos
            </button>
            <button onclick="filterMedia('videos')" class="filter-btn bg-white text-[#1a4789] border border-blue-100 px-8 py-2.5 rounded-full text-xs font-bold uppercase tracking-widest transition-all hover:bg-blue-50 active:scale-95">
                Videos
            </button>
        </div>

        <div id="gallery-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8">
            
            <div class="gallery-item animate-fade-in group relative aspect-video bg-gray-200 rounded-[2rem] overflow-hidden shadow-lg border-4 border-white" data-category="photos">
                <img src="https://images.unsplash.com/photo-1511632765486-a01980e01a18?q=80&w=800" class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-110">
                <div class="absolute inset-0 bg-[#1a4789]/60 opacity-0 group-hover:opacity-100 transition-opacity flex flex-col items-center justify-center p-6 text-center">
                    <span class="text-[#ffed00] text-xs font-black uppercase tracking-widest mb-2">Sports Day</span>
                    <p class="text-white text-sm font-bold">Annual Inter-Campus Athletics</p>
                </div>
            </div>

            <div class="gallery-item animate-fade-in group relative aspect-video bg-gray-200 rounded-[2rem] overflow-hidden shadow-lg border-4 border-white" data-category="videos">
                <img src="https://images.unsplash.com/photo-1516280440614-37939bbacd81?q=80&w=800" class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-110">
                <div class="absolute inset-0 flex items-center justify-center">
                    <div class="w-16 h-16 bg-[#ffed00] rounded-full flex items-center justify-center shadow-2xl transition-transform group-hover:scale-125">
                        <i class="fas fa-play text-[#1a4789] text-xl ml-1"></i>
                    </div>
                </div>
                <div class="absolute bottom-0 left-0 right-0 p-6 bg-gradient-to-t from-[#1a4789] to-transparent">
                    <span class="text-white text-xs font-black uppercase tracking-widest">Video Feature</span>
                    <p class="text-blue-200 text-sm">Highlights: Cultural Festival</p>
                </div>
            </div>

            <div class="gallery-item animate-fade-in group relative aspect-video bg-gray-200 rounded-[2rem] overflow-hidden shadow-lg border-4 border-white" data-category="photos">
                <img src="https://images.unsplash.com/photo-1503676260728-1c00da094a0b?q=80&w=800" class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-110">
                <div class="absolute inset-0 bg-[#1a4789]/60 opacity-0 group-hover:opacity-100 transition-opacity flex flex-col items-center justify-center p-6 text-center">
                    <span class="text-[#ffed00] text-xs font-black uppercase tracking-widest mb-2">Art Exhibition</span>
                    <p class="text-white text-sm font-bold">Creative Arts Week Gallery</p>
                </div>
            </div>

        </div>
    </main>

    <footer class="bg-[#1a4789] py-12 border-t-8 border-[#ffed00]">
        <div class="max-w-7xl mx-auto px-4 text-center">
            <h4 class="text-[#ffed00] font-black text-xl tracking-[0.4em] uppercase mb-4 italic">I Am - To Learn</h4>
            <p class="text-blue-200/50 text-[10px] uppercase tracking-widest">The City School Chakwal Campus Official Portal</p>
        </div>
    </footer>

    <script>
        function filterMedia(category) {
            const items = document.querySelectorAll('.gallery-item');
            const buttons = document.querySelectorAll('.filter-btn');

            // 1. Update Button Styles
            buttons.forEach(btn => {
                // Set all to "inactive" style
                btn.classList.remove('bg-[#1a4789]', 'text-white', 'shadow-lg');
                btn.classList.add('bg-white', 'text-[#1a4789]', 'border', 'border-blue-100');
            });

            // Set the clicked button to "active" style
            const clickedBtn = event.currentTarget;
            clickedBtn.classList.add('bg-[#1a4789]', 'text-white', 'shadow-lg');
            clickedBtn.classList.remove('bg-white', 'text-[#1a4789]', 'border', 'border-blue-100');

            // 2. Filter Grid Items
            items.forEach(item => {
                // Remove animation class to re-trigger it
                item.classList.remove('animate-fade-in');
                
                if (category === 'all' || item.getAttribute('data-category') === category) {
                    item.style.display = 'block';
                    // Re-trigger animation
                    setTimeout(() => item.classList.add('animate-fade-in'), 10);
                } else {
                    item.style.display = 'none';
                }
            });
        }
    </script>

</body>
</html>
