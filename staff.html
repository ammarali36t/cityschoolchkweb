    <script>
    // --- MOBILE MENU LOGIC ---
    document.addEventListener('DOMContentLoaded', () => {
        const btn = document.getElementById('mobile-menu-button');
        const menu = document.getElementById('mobile-menu');

        if (btn && menu) {
            btn.addEventListener('click', () => {
                menu.classList.toggle('hidden');
            });
        }
    });

    // --- FACULTY LOADER LOGIC ---
    async function loadFaculty() {
        const headSection = document.getElementById('head-section');
        const grid = document.getElementById('faculty-grid');
        const repoOwner = "ammarali36t";
        const repoName = "cityschoolchkweb";
        const folderPath = "content/faculty";

        try {
            const response = await fetch(`https://api.github.com/repos/${repoOwner}/${repoName}/contents/${folderPath}?t=${new Date().getTime()}`);
            const files = await response.json();
            
            let facultyData = [];

            // 1. Fetch all data first
            for (const file of files) {
                if (file.name.endsWith('.json')) {
                    const contentRes = await fetch(file.download_url);
                    const member = await contentRes.json();
                    facultyData.push(member);
                }
            }

            // 2. Sort: Headmistress stays first, rest ordered by numeric input value safely
            facultyData.sort((a, b) => {
                const aHead = a.is_head === true || a.is_head === "true";
                const bHead = b.is_head === true || b.is_head === "true";
                
                if (aHead !== bHead) {
                    return bHead - aHead;
                }
                
                const orderA = parseInt(a.order) || 999;
                const orderB = parseInt(b.order) || 999;
                return orderA - orderB;
            });

            grid.innerHTML = '';
            headSection.innerHTML = '';

            facultyData.forEach((member) => {
                // Parse clean image file coordinates
                let rawPath = member.image || '';
                let cleanPath = rawPath.replace(/^(\.\/|\/)/, ''); 
                
                // Primary: Try relative file structure first
                const localUrl = `./${cleanPath}`;
                // Fallback: Build the GitHub proxy mirror link
                const githubBackupUrl = `https://raw.githubusercontent.com/${repoOwner}/${repoName}/main/${cleanPath}`;
                
                const cardHtml = `
                    <div class="staff-card bg-white rounded-2xl shadow-sm border border-slate-100 p-2 md:p-6 text-center hover:shadow-md transition">
                        <div class="relative mx-auto w-16 h-16 md:w-32 md:h-32 mb-3">
                            <img src="${localUrl}" alt="${member.title}" 
                                 class="rounded-full w-full h-full object-cover border-2 md:border-4 border-[#ffed00] shadow-sm"
                                 style="aspect-ratio: 1/1;"
                                 onerror="if(this.src.indexOf('raw.githubusercontent.com') === -1) { this.src='${githubBackupUrl}'; } else { this.src='https://ui-avatars.com/api/?name=${encodeURIComponent(member.title)}&background=f1f5f9&color=1a4789'; }">
                        </div>
                        <h3 class="text-[#1a4789] font-black text-[9px] md:text-lg uppercase leading-tight px-1">${member.title}</h3>
                        <p class="text-slate-400 font-bold text-[7px] md:text-xs uppercase mb-2">${member.role}</p>
                        <div class="bg-slate-50 rounded-lg py-1">
                            <p class="text-[#1a4789] text-[7px] md:text-[10px] font-bold">${member.order} Years Experience</p>
                        </div>
                    </div>
                `;

                if (member.is_head === true || member.is_head === "true") {
                    headSection.innerHTML = cardHtml.replace('w-16 h-16 md:w-32 md:h-32', 'w-28 h-28 md:w-48 md:h-48');
                } else {
                    grid.innerHTML += cardHtml;
                }
            });
        } catch (error) {
            console.error("Error:", error);
        }
    }
    
    window.onload = loadFaculty;
</script>
